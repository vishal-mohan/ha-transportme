# Suppress false-positive secret scanning alerts for the Firebase web API key.
#
# The key AIzaSyD9xVRwjC0V-FHj5D97pwD8oGUNCufs9vI is TransportMe's PUBLIC
# client-side Firebase configuration, extracted from the TransportMe Android
# APK where it is shipped to every user's device.  Firebase web API keys are
# intentionally public — access control is enforced by server-side Firebase
# Security Rules, not by keeping the key secret.  Revoking or rotating it is
# not possible (it belongs to TransportMe) and would break their app for all
# users worldwide.
#
# References:
#   https://firebase.google.com/docs/projects/api-keys
#   "Unlike how API keys are typically used, API keys for Firebase services are
#    not used to control access to backend resources; that can only be done with
#    Firebase Security Rules."

paths-ignore:
  - "get_token.html"
  - "custom_components/transportme/config_flow.py"
  - "custom_components/transportme/coordinator.py"
  - "custom_components/transportme/views.py"
